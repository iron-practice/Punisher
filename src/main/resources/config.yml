# IronPunisher - all Paper servers MUST point to the same MySQL/MariaDB database.
# server-id must be unique for every server in your network.
server-id: "server-01"

database:
  host: "127.0.0.1"
  port: 3306
  name: "ironpunisher"
  username: "ironpunisher"
  password: "CHANGE_ME"
  ssl: false
  pool-size: 10
  async-threads: 4

# Checks recent punishments so a player who is already online on another server
# is kicked shortly after a punishment is created.
sync:
  interval-ticks: 40
  lookback-seconds: 120

discord: ""

messages:
  punish-success: "<green><player> has been banned for <duration>.</green>"
  login-ban: "<red>You are banned from this network.</red>\n\n<gray>Reason: <white><reason></white>\n<gray>Expires: <white><expires></white>"
  kick-ban: "<red>You are banned from this network.</red>\n\n<gray>Reason: <white><reason></white>\n<gray>Expires: <white><expires></white>\n\n<gray>Appeal: <white><discord>"
